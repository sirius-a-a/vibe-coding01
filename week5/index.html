<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的第一个网页 - Vibe Coding</title>
</head>

<body>
    <!-- 头部区域 -->
    <header>
        <h1>🌐 Vibe Coding 学习笔记</h1>
        <p>HTML 骨架构建</p>
    </header>

    <!-- 主要内容区 -->
    <div class="content">
        <h2>📋 今日任务清单</h2>
        <ul>
            <li>✅ 创建 HTML 文件</li>
            <li>✅ 包含 header、div、form、button 标签</li>
            <li>✅ 浏览器正常显示，无乱码</li>
        </ul>

        <!-- 表单区域 -->
        <form id="demoForm">
            <label for="name">你的名字：</label>
            <input type="text" id="name" name="name" placeholder="请输入你的名字">

            <label for="message">留言：</label>
            <textarea id="message" name="message" rows="3" placeholder="想说什么？"></textarea>

            <button type="submit">提交留言</button>
        </form>
    </div>

    <!-- 底部区域 -->
    <footer>
        <p>© 2026 Vibe Coder | 学习记录</p>
    </footer>
</body>

</html>
