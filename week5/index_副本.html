<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的第一个网页 - Vibe Coding</title>
    <!-- 引入 CSS 样式（Day 23 新增） -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <!-- 头部区域 -->
        <header>
            <h1>🌐 Vibe Coding 学习笔记</h1>
            <p>CSS 美化 | 使用 Flex 布局</p>
        </header>

        <!-- 主要内容区 -->
        <div class="content-card">
            <h2>📋 今日任务清单</h2>
            <ul class="task-list">
                <li>✅ 创建 HTML 文件</li>
                <li>🎨 添加 CSS 样式，美化页面</li>
                <li>📐 使用 Flex 实现居中布局</li>
                <li>🎨 自定义背景色和字体颜色</li>
            </ul>

            <!-- 表单区域 -->
            <form id="demoForm">
                <div class="form-group">
                    <label for="name">你的名字：</label>
                    <input type="text" id="name" name="name" placeholder="请输入你的名字">
                </div>

                <div class="form-group">
                    <label for="message">留言：</label>
                    <textarea id="message" name="message" rows="3" placeholder="想说什么？"></textarea>
                </div>

                <button type="submit">✨ 提交留言 ✨</button>
            </form>

            <!-- Flex 居中示例（验收要求） -->
            <div class="flex-demo">
                🎯 这是用 Flex 实现的内容居中示例
            </div>
        </div>

        <!-- 底部区域 -->
        <footer>
            <p>© 2026 Vibe Coder | CSS 美化完成 ✅</p>
        </footer>
    </div>
</body>

</html>
