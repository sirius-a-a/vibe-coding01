<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的第一个网页 - Vibe Coding</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>🌐 Vibe Coding 学习笔记</h1>
            <p>JavaScript 行为入门 | 交互式留言板</p>
        </header>

        <div class="content-card">
            <h2>📋 今日任务清单</h2>
            <ul class="task-list">
                <li>✅ 创建 HTML 文件</li>
                <li>🎨 添加 CSS 样式</li>
                <li>⚡ 添加 JavaScript 交互</li>
                <li>📌 绑定点击事件，实现留言功能</li>
            </ul>

            <form id="demoForm">
                <div class="form-group">
                    <label for="name">你的名字：</label>
                    <input type="text" id="name" name="name" placeholder="请输入你的名字">
                </div>

                <div class="form-group">
                    <label for="message">留言：</label>
                    <textarea id="message" name="message" rows="3" placeholder="想说什么？"></textarea>
                </div>

                <button type="submit">✨ 发布留言 ✨</button>
            </form>

            <div class="flex-demo">
                🎯 点我试试！这是用 Flex 实现的内容居中示例
            </div>
        </div>

        <footer>
            <p>© 2026 Vibe Coder | JS 交互完成 ✅</p>
        </footer>
    </div>

    <!-- 引入 JavaScript -->
    <script src="script.js"></script>
</body>

</html>
